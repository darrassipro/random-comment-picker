<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>FB Random Comment Picker</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            padding: 20px; 
            margin: 0;
        }
        .container { 
            background: white; 
            padding: 40px; 
            border-radius: 15px; 
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3); 
        }
        h1 { color: #1877f2; text-align: center; margin-top: 0; }
        .login-section { text-align: center; margin: 20px 0; }
        .login-section fb\\:login-button { text-align: center; }
        .picker-section { display: none; }
        .picker-section.active { display: block; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            box-sizing: border-box; 
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #1877f2;
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: linear-gradient(135deg, #1877f2 0%, #0a66c2 100%);
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px;
            margin-top: 10px;
            transition: transform 0.2s;
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(24,119,242,0.4);
        }
        button:active { transform: translateY(0); }
        .result { 
            margin-top: 20px; 
            padding: 20px; 
            background: #f0f7ff; 
            border-left: 4px solid #1877f2;
            border-radius: 5px; 
            display: none;
            animation: slideIn 0.3s ease-in-out;
        }
        .result.active { display: block; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .winner-name { color: #1877f2; font-weight: bold; font-size: 18px; margin-bottom: 10px; }
        .winner-comment { color: #333; font-size: 14px; line-height: 1.5; }
        .error { background: #ffe0e0; border-left-color: #ff4444; color: #cc0000; }
        .loading { text-align: center; color: #1877f2; }
        .user-info { 
            background: #f5f5f5; 
            padding: 10px 15px; 
            border-radius: 5px; 
            margin: 10px 0; 
            font-size: 14px; 
            text-align: center;
        }
        .logout-btn {
            background: #e0e0e0;
            color: #333;
            padding: 8px 16px;
            font-size: 12px;
            width: auto;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎉 FB Random Comment Picker</h1>
    
    <div class="login-section" id="loginSection">
        <p>Login to get started:</p>
        <fb:login-button scope="public_profile,pages_read_engagement" onlogin="checkLoginState();"></fb:login-button>
        <button onclick="fbLogin()" style="margin-top: 10px; background: #1877f2;">📘 Login with Facebook</button>
    </div>

    <div class="picker-section" id="pickerSection">
        <div class="user-info" id="userInfo"></div>
        <input type="text" id="postId" placeholder="Enter Post ID (e.g., 939135105350773)">
        <button onclick="fetchComments()">🎲 Pick Random Winner</button>
        <button class="logout-btn" onclick="logoutFB()">Logout</button>
        <div class="result" id="result"></div>
    </div>
</div>

<script>
    // Your Configuration ID / App ID
    const APP_ID = '889592040642068';
    let accessToken = null;

    // Initialize Facebook SDK
    window.fbAsyncInit = function() {
        FB.init({
            appId: APP_ID,
            cookie: true,
            xfbml: true,
            version: 'v19.0'
        });
        FB.XFBML.parse();
    };

    // Load the Facebook SDK script
    (function(d, s, id) {
        var js, fjs = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) return;
        js = d.createElement(s); js.id = id;
        js.src = "https://connect.facebook.net/en_US/sdk.js";
        fjs.parentNode.insertBefore(js, fjs);
    }(document, 'script', 'facebook-jssdk'));

    function checkLoginState() {
        FB.getLoginStatus(function(response) {
            if (response.status === 'connected') {
                accessToken = response.authResponse.accessToken;
                showPickerUI(response.authResponse.userID);
            } else {
                alert('Please login to continue.');
            }
        });
    }

    function fbLogin() {
        FB.login(function(response) {
            if (response.authResponse) {
                checkLoginState();
            }
        }, {scope: 'public_profile,pages_read_engagement'});
    }

    function showPickerUI(userID) {
        // Get user info
        FB.api('/me', function(response) {
            document.getElementById('userInfo').innerHTML = `Logged in as: <b>${response.name}</b>`;
        });
        
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('pickerSection').classList.add('active');
    }

    function logoutFB() {
        FB.logout(function(response) {
            accessToken = null;
            document.getElementById('pickerSection').classList.remove('active');
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('result').classList.remove('active');
        });
    }

    async function fetchComments() {
        if (!accessToken) {
            alert('Please login first');
            return;
        }

        const postId = document.getElementById("postId").value.trim();
        const resultDiv = document.getElementById("result");
        
        if (!postId) return alert("Enter Post ID");

        resultDiv.classList.remove('active');
        resultDiv.innerHTML = '<div class="loading">🔄 Fetching comments...</div>';
        resultDiv.classList.add('active');

        let comments = [];
        let url = `https://graph.facebook.com/v19.0/${postId}/comments?access_token=${accessToken}&limit=100&fields=id,message,from`;

        try {
            while (url) {
                const response = await fetch(url);
                const data = await response.json();

                if (data.error) throw new Error(data.error.message);

                comments = comments.concat(data.data.filter(c => c.message));
                url = (data.paging && data.paging.next) ? data.paging.next : null;
            }

            if (comments.length === 0) {
                resultDiv.innerHTML = "No comments found. Check the Post ID or permissions.";
                return;
            }

            const winner = comments[Math.floor(Math.random() * comments.length)];
            resultDiv.innerHTML = `
                <div class="winner-name">🎊 ${winner.from ? winner.from.name : 'Anonymous'}</div>
                <div class="winner-comment">"${winner.message}"</div>
                <div style="margin-top: 10px; font-size: 12px; color: #999;">Total comments checked: ${comments.length}</div>
            `;
        } catch (e) {
            resultDiv.classList.add('error');
            resultDiv.innerHTML = "<b>⚠️ Error:</b> " + e.message;
        }
    }
</script>

</body>
</html>
